project_name: ts_project
target_col: balance
date_col: date
prediction_horizon: 1

s3:
  endpoint_url: https://storage.yandexcloud.net
  region_name: ru-central1
  bucket: ts-project-bucket
  raw_prefix: raw/
  interim_prefix: interim/
  features_prefix: features/
  models_prefix: models/
  predictions_prefix: predictions/
  metrics_prefix: metrics/

model:
  production_prefix: models/production/
  metric: mae
  min_improvement: 0.0
  validation_size: 0.2
  promote_if_better: true

mlflow:
  tracking_uri: ${MLFLOW_TRACKING_URI}
  experiment_name: ts-project
  registered_model_name: ts-project-forecast-model
  model_alias: champion
  artifact_root: s3://ts-project-bucket/mlflow-artifacts
  log_input_examples: true
  log_model_signature: true
  challenger_alias: challenger
  champion_alias: champion

training:
  model_kind: flaml
  fallback_model: random_forest
  time_budget: 600
  metric: mae
  validation_size: 0.2
  random_state: 42

evaluation:
  key_rate: 0.21
  primary_metric: mae
  business_metric: profit

promotion:
  min_mae_improvement: 0.0
  require_profit_not_worse: true

dvc:
  enabled: true
  remote_name: yc-storage
  remote_url: s3://ts-project-bucket/dvc-store
  endpoint_url: https://storage.yandexcloud.net

feature_engineering:
  lags:
    - 1
    - 2
    - 7
  rolling_windows:
    - 3
    - 7
    - 30
  use_calendar_features: true
  use_tax_features: true
  use_macro_features: true

feature_selection:
  enabled: true
  mode: "target_aware"
  default_method: "default"
  methods:
    remove_constant: true
    remove_high_missing: true
    remove_high_correlation: true
    remove_low_importance: true
  missing_threshold: 0.4
  correlation_threshold: 0.95
  validation_size: 0.2
  importance_model: "random_forest"
  importance_threshold: 0.01
  max_features: null
  random_state: 42
  wrapper:
    min_features_to_select: 5
    step: 1
    scoring: "neg_mean_squared_error"
  filter:
    threshold: 0.01
    delay: 1
    embed_dim: 3
  always_keep:
    - date
  target_aware_metrics:
    use_mutual_info: true
    use_correlation_with_target: true

service:
  model_reload_seconds: 300
  log_level: INFO
